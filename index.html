<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f5f2" />
  <title>Daymark · 每日个人提醒</title>
  <style>
    :root { --bg:#f2f2ef; --paper:#fff; --ink:#111; --muted:#858589; --line:#e8e8e5; --lime:#bfdc3c; --lav:#e5e4f1; --orange:#ffb49b; --shadow:0 18px 45px rgba(20,20,20,.07); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input, select { font:inherit; }
    button { border:0; cursor:pointer; }
    .shell { width:min(100%, 1180px); margin:0 auto; padding:24px 24px 112px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:28px; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:800; letter-spacing:-.04em; }
    .brand-mark { width:34px; height:34px; display:grid; place-items:center; border-radius:50%; background:var(--ink); color:#fff; font-size:15px; }
    .brand small { display:block; color:var(--muted); font-size:11px; letter-spacing:.02em; font-weight:600; }
    .today-chip { border:1px solid #deded9; border-radius:999px; padding:10px 15px; background:rgba(255,255,255,.62); color:#505052; font-size:13px; }
    .hero { display:grid; grid-template-columns:1.2fr .8fr; gap:18px; margin-bottom:18px; }
    .hero-copy, .focus-card, .panel { background:var(--paper); border-radius:30px; box-shadow:var(--shadow); }
    .hero-copy { min-height:300px; padding:36px 38px; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; position:relative; }
    .eyebrow { color:#77777b; font-size:12px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; }
    h1 { font-size:clamp(42px, 6vw, 78px); line-height:.94; letter-spacing:-.075em; margin:16px 0 0; max-width:650px; }
    .hero-foot { display:flex; align-items:end; justify-content:space-between; gap:20px; }
    .hero-foot p { max-width:340px; margin:0; color:var(--muted); line-height:1.6; font-size:14px; }
    .primary { border-radius:999px; padding:13px 18px; background:var(--ink); color:#fff; font-weight:700; white-space:nowrap; transition:transform .2s, background .2s; }
    .primary:hover { transform:translateY(-2px); background:#343434; }
    .focus-card { padding:28px; background:var(--lime); display:flex; flex-direction:column; justify-content:space-between; min-height:300px; }
    .focus-card h2 { font-size:31px; line-height:1.02; letter-spacing:-.06em; margin:10px 0; }
    .focus-card p { color:#4d5a1d; font-size:13px; line-height:1.5; max-width:260px; }
    .focus-meta { border-top:1px solid rgba(17,17,17,.18); padding-top:15px; display:flex; justify-content:space-between; font-size:12px; }
    .grid { display:grid; grid-template-columns:1.35fr .85fr; gap:18px; align-items:start; }
    .panel { padding:25px; }
    .panel-header { display:flex; align-items:center; justify-content:space-between; gap:15px; margin-bottom:20px; }
    .panel-title { margin:0; font-size:21px; letter-spacing:-.045em; }
    .panel-subtitle { color:var(--muted); font-size:12px; }
    .tabs { display:flex; gap:6px; background:#f4f4f1; padding:4px; border-radius:999px; }
    .tab { padding:8px 12px; border-radius:999px; background:transparent; color:#8a8a8d; font-size:12px; }
    .tab.active { background:#fff; color:var(--ink); box-shadow:0 2px 7px rgba(0,0,0,.07); font-weight:700; }
    .task-list { display:flex; flex-direction:column; gap:9px; }
    .task { display:grid; grid-template-columns:42px 1fr auto; gap:12px; align-items:center; padding:13px 14px; border:1px solid var(--line); border-radius:18px; background:#fff; transition:.2s; }
    .task:hover { border-color:#c9c9c3; transform:translateY(-1px); }
    .task.done { opacity:.55; }
    .task.done .task-name { text-decoration:line-through; }
    .task-time { color:#9a9a9c; font-size:11px; text-align:center; }
    .task-time strong { display:block; color:#222; font-size:13px; }
    .task-name { font-size:14px; font-weight:700; }
    .task-detail { display:block; color:var(--muted); font-size:11px; margin-top:4px; }
    .task-actions { display:flex; align-items:center; gap:7px; }
    .tag { border-radius:999px; padding:6px 9px; font-size:10px; background:var(--lav); color:#626074; white-space:nowrap; }
    .tag.green { background:#eaf3bd; color:#596521; } .tag.orange { background:#ffe0d5; color:#8d4c35; }
    .check { width:25px; height:25px; border:1px solid #d7d7d3; border-radius:50%; background:#fff; color:transparent; font-size:14px; }
    .check:hover { border-color:#111; } .done .check { background:var(--ink); color:#fff; border-color:var(--ink); }
    .calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
    .weekday { color:#a0a0a4; font-size:10px; text-align:center; padding:2px 0 5px; }
    .day { min-height:48px; border:1px solid #eee; border-radius:13px; padding:8px; color:#96969b; font-size:11px; background:#fbfbfa; position:relative; }
    .day.has { color:#161616; background:#f6f7e9; } .day.active { border:2px solid #8ca029; padding:7px; color:#111; }
    .dots { display:flex; gap:3px; position:absolute; left:8px; bottom:7px; }
    .dot { width:5px; height:5px; border-radius:50%; background:var(--lime); } .dot.pink { background:var(--orange); } .dot.purple { background:#b8b5d9; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:18px; border-top:1px solid var(--line); padding-top:19px; }
    .stat b { display:block; font-size:25px; letter-spacing:-.07em; } .stat span { color:var(--muted); font-size:11px; }
    .side-stack { display:flex; flex-direction:column; gap:18px; }
    .project { padding:16px 0; border-top:1px solid var(--line); } .project:first-child { border-top:0; padding-top:0; }
    .project-row { display:flex; justify-content:space-between; gap:12px; align-items:center; }
    .project-name { font-weight:800; font-size:14px; } .project-next { margin-top:7px; color:var(--muted); font-size:12px; line-height:1.45; }
    .progress { height:6px; background:#efefeb; border-radius:9px; margin-top:12px; overflow:hidden; } .progress i { display:block; height:100%; background:var(--ink); border-radius:9px; }
    .review { background:var(--ink); color:#fff; } .review .panel-subtitle { color:#9a9a9e; } .review .panel-title { color:#fff; }
    .review-q { padding:14px 0; border-top:1px solid #303033; } .review-q:first-of-type { border-top:0; }
    .review-q label { display:block; font-size:13px; margin-bottom:8px; } .review-q textarea { width:100%; min-height:47px; resize:vertical; border:0; border-radius:12px; background:#242426; color:#fff; padding:10px; outline:none; }
    .save-review { width:100%; margin-top:7px; padding:11px; border-radius:12px; background:var(--lime); color:#202500; font-weight:800; }
    .fab { position:fixed; right:28px; bottom:25px; width:58px; height:58px; border-radius:50%; background:var(--lime); color:var(--ink); font-size:30px; box-shadow:0 12px 25px rgba(96,114,14,.25); z-index:4; }
    .modal-backdrop { position:fixed; inset:0; display:none; place-items:center; background:rgba(15,15,15,.25); z-index:8; padding:20px; } .modal-backdrop.open { display:grid; }
    .modal { width:min(100%, 460px); border-radius:26px; background:#fff; padding:25px; box-shadow:0 25px 80px rgba(0,0,0,.2); }
    .modal h3 { margin:0 0 18px; font-size:24px; letter-spacing:-.06em; } .form { display:grid; gap:12px; } .form label { color:var(--muted); font-size:12px; } .form input, .form select { width:100%; margin-top:6px; border:1px solid var(--line); border-radius:12px; padding:11px; outline:none; background:#fafaf8; } .modal-actions { display:flex; justify-content:end; gap:8px; margin-top:19px; } .ghost { border-radius:999px; padding:11px 16px; background:#f1f1ee; color:#555; }
    .empty { padding:30px; text-align:center; color:var(--muted); font-size:13px; }
    @media (max-width:820px) { .hero, .grid { grid-template-columns:1fr; } .hero-copy { min-height:280px; } .focus-card { min-height:220px; } }
    @media (max-width:560px) { .shell { padding:18px 14px 98px; } .hero-copy, .focus-card, .panel { border-radius:23px; padding:20px; } h1 { font-size:49px; } .hero-foot { align-items:start; flex-direction:column; } .today-chip { font-size:12px; } .task { grid-template-columns:35px 1fr auto; gap:8px; } .tag { display:none; } .panel-header { align-items:start; flex-direction:column; } .stats b { font-size:22px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><span class="brand-mark">✦</span><div>DAYMARK<small>个人节奏助手</small></div></div><div class="today-chip" id="dateLabel"></div></header>
    <section class="hero">
      <div class="hero-copy"><div><div class="eyebrow">Thursday / daily rhythm</div><h1>把今天，<br>过得有进展。</h1></div><div class="hero-foot"><p>不是塞满待办，而是找到现在最值得推进的一小步。</p><button class="primary" id="startFocus">开始专注&nbsp; ↗</button></div></div>
      <div class="focus-card"><div><div class="eyebrow">今日焦点 · 25 min</div><h2 id="focusTitle">写出首页的三个区域</h2><p id="focusDesc">个人提醒助手 · 从最小可见成果开始，不追求一次完成所有事情。</p></div><div class="focus-meta"><span id="focusType">搓项目</span><span id="focusTime">19:00 — 19:25</span></div></div>
    </section>
    <section class="grid">
      <div class="panel"><div class="panel-header"><div><h2 class="panel-title">今天要做什么</h2><span class="panel-subtitle" id="taskCount">3 项安排 · 已完成 1 项</span></div><div class="tabs"><button class="tab active" data-filter="all">全部</button><button class="tab" data-filter="open">未完成</button><button class="tab" data-filter="done">已完成</button></div></div><div class="task-list" id="taskList"></div></div>
      <div class="side-stack">
        <div class="panel"><div class="panel-header"><div><h2 class="panel-title">本月节奏</h2><span class="panel-subtitle">完成不是唯一指标，连续推进更重要</span></div><span class="panel-subtitle">2026 / 10</span></div><div class="calendar" id="calendar"></div><div class="stats"><div class="stat"><b id="todayStat">1</b><span>今日完成</span></div><div class="stat"><b>4</b><span>本周推进</span></div><div class="stat"><b>5</b><span>连续天数</span></div></div></div>
        <div class="panel"><div class="panel-header"><div><h2 class="panel-title">项目下一步</h2><span class="panel-subtitle">让项目每天靠近一点</span></div><button class="panel-subtitle" id="addProject">+ 新项目</button></div><div id="projectList"></div></div>
        <div class="panel review"><div class="panel-header"><div><h2 class="panel-title">晚间三问</h2><span class="panel-subtitle">用 2 分钟给明天留一点线索</span></div><span>☾</span></div><div class="review-q"><label>今天真正推进了什么？</label><textarea id="review1" placeholder="哪怕只是一个小动作……"></textarea></div><div class="review-q"><label>什么让你没有完成？</label><textarea id="review2" placeholder="记录原因，不评价自己"></textarea></div><div class="review-q"><label>明天的第一步是什么？</label><textarea id="review3" placeholder="写成可以立刻开始的动作"></textarea></div><button class="save-review" id="saveReview">保存今天的复盘</button></div>
      </div>
    </section>
  </main>
  <button class="fab" id="openModal" aria-label="添加任务">+</button>
  <div class="modal-backdrop" id="modalBackdrop"><div class="modal"><h3>添加一个可执行动作</h3><div class="form"><label>任务名称<input id="newTitle" placeholder="例如：完成英语错题第 1 组" /></label><label>时间<input id="newTime" type="time" value="20:00" /></label><label>类型<select id="newType"><option value="学习">自我查缺补漏</option><option value="项目">搓项目</option><option value="生活">生活维护</option><option value="锻炼">锻炼</option></select></label><label>预计用时<select id="newDuration"><option>25 分钟</option><option>45 分钟</option><option>60 分钟</option></select></label></div><div class="modal-actions"><button class="ghost" id="closeModal">取消</button><button class="primary" id="addTask">加入今天</button></div></div></div>
  <script>
    const seedTasks = [
      { id:1, time:'08:30', title:'参加产品设计课', detail:'带上昨天整理的参考图', type:'上课', color:'lav', done:true },
      { id:2, time:'17:30', title:'力量训练 30 分钟', detail:'肩背 + 核心，结束后喝水', type:'锻炼', color:'orange', done:false },
      { id:3, time:'19:00', title:'写出首页的三个区域', detail:'个人提醒助手 · 25 分钟', type:'搓项目', color:'green', done:false },
      { id:4, time:'21:00', title:'复习 JavaScript 异步', detail:'完成 5 道辨析题', type:'查缺补漏', color:'lav', done:false }
    ];
    let tasks = JSON.parse(localStorage.getItem('daymark-tasks') || 'null') || seedTasks;
    const projects = [{name:'个人提醒助手', next:'写出首页的三个区域', progress:38}, {name:'英语语法查缺补漏', next:'完成过去完成时 5 道题', progress:62}];
    const $ = id => document.getElementById(id);
    const save = () => localStorage.setItem('daymark-tasks', JSON.stringify(tasks));
    const today = new Date();
    $('dateLabel').textContent = `${today.getFullYear()} / ${String(today.getMonth()+1).padStart(2,'0')} / ${String(today.getDate()).padStart(2,'0')} · 周${'日一二三四五六'[today.getDay()]}`;
    function renderTasks(filter='all') {
      const shown = tasks.filter(t => filter==='all' || (filter==='done' ? t.done : !t.done));
      $('taskList').innerHTML = shown.length ? shown.map(t => `<article class="task ${t.done?'done':''}"><div class="task-time"><strong>${t.time}</strong>${t.time==='08:30'?'上午':'晚上'}</div><div><div class="task-name">${t.title}</div><span class="task-detail">${t.detail}</span></div><div class="task-actions"><span class="tag ${t.color}">${t.type}</span><button class="check" data-id="${t.id}" aria-label="标记完成">✓</button></div></article>`).join('') : '<div class="empty">这一栏暂时没有任务。</div>';
      const done = tasks.filter(t=>t.done).length; $('taskCount').textContent = `${tasks.length} 项安排 · 已完成 ${done} 项`; $('todayStat').textContent = done;
      document.querySelectorAll('.check').forEach(btn => btn.addEventListener('click', () => { const t=tasks.find(x=>x.id===Number(btn.dataset.id)); t.done=!t.done; save(); renderTasks(document.querySelector('.tab.active').dataset.filter); updateFocus(); }));
    }
    function updateFocus(){ const next=tasks.find(t=>!t.done) || tasks[0]; if(!next)return; $('focusTitle').textContent=next.title; $('focusDesc').textContent=next.detail; $('focusType').textContent=next.type; $('focusTime').textContent=`${next.time} — ${next.time==='19:00'?'19:25':'今日'}`; }
    function renderCalendar(){ const days=['一','二','三','四','五','六','日']; const start= new Date(2026,9,1).getDay() || 7; let html=days.map(d=>`<div class="weekday">${d}</div>`).join(''); for(let i=1;i<start;i++) html+='<div></div>'; for(let d=1;d<=31;d++){ const active=d===today.getDate(); const has=[2,3,6,7,9,12,13,14,15].includes(d); html+=`<div class="day ${has?'has':''} ${active?'active':''}">${d}${has?'<div class="dots"><i class="dot"></i><i class="dot purple"></i></div>':''}</div>`; } $('calendar').innerHTML=html; }
    function renderProjects(){ $('projectList').innerHTML=projects.map(p=>`<div class="project"><div class="project-row"><span class="project-name">${p.name}</span><span class="panel-subtitle">${p.progress}%</span></div><div class="project-next">下一步：${p.next}</div><div class="progress"><i style="width:${p.progress}%"></i></div></div>`).join(''); }
    document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); tab.classList.add('active'); renderTasks(tab.dataset.filter); }));
    const modal = $('modalBackdrop'); $('openModal').onclick=()=>modal.classList.add('open'); $('closeModal').onclick=()=>modal.classList.remove('open'); modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
    $('addTask').onclick=()=>{ const title=$('newTitle').value.trim(); if(!title){$('newTitle').focus();return;} tasks.push({id:Date.now(),time:$('newTime').value,title,detail:`预计 ${$('newDuration').value} · 今天完成`,type:$('newType').value,color:$('newType').value==='锻炼'?'orange':$('newType').value==='项目'?'green':'lav',done:false}); save(); renderTasks('all'); updateFocus(); modal.classList.remove('open'); $('newTitle').value=''; };
    $('startFocus').onclick=()=>{ const next=tasks.find(t=>!t.done); if(next){ alert(`现在开始：${next.title}\n建议先专注 25 分钟。`); } };
    $('saveReview').onclick=()=>{ localStorage.setItem('daymark-review', JSON.stringify({a:$('review1').value,b:$('review2').value,c:$('review3').value,date:Date.now()})); $('saveReview').textContent='已保存 · 明天继续'; setTimeout(()=>$('saveReview').textContent='保存今天的复盘',1800); };
    const oldReview=JSON.parse(localStorage.getItem('daymark-review')||'null'); if(oldReview){$('review1').value=oldReview.a||'';$('review2').value=oldReview.b||'';$('review3').value=oldReview.c||'';}
    renderTasks(); updateFocus(); renderCalendar(); renderProjects();
  </script>
</body>
</html>
