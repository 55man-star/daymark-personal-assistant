<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>念成事 · 把一句话变成安排</title>
<style>
:root{--bg:#f6f7f8;--ink:#22252a;--muted:#8d9299;--line:#e6e8eb;--orange:#f5a07b;--orange-deep:#df7a4e;--orange-soft:#fff0e9;--green:#5c9879;--green-soft:#e6f3ed;--blue-soft:#eaf0f8;--purple-soft:#f0ebf7;--yellow-soft:#fff6dc;--shadow:0 10px 30px rgba(52,59,69,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}.app{width:min(100%,820px);margin:auto;padding:20px 18px 110px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#f8b185,#ea875d);display:grid;place-items:center;font-size:22px;box-shadow:0 5px 12px rgba(223,122,78,.22)}.brand h1{font-size:19px;letter-spacing:-.04em;margin:0}.brand p{font-size:11px;color:var(--muted);margin:3px 0 0}.calendar-pill{display:flex;align-items:center;gap:7px;border:1px solid #dfe3e7;background:#fff;border-radius:999px;padding:9px 13px;color:#777d84;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.hero{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px 22px 18px;box-shadow:var(--shadow)}.hero-kicker{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;margin-bottom:10px}.hero h2{font-size:25px;letter-spacing:-.06em;margin:0 0 5px}.hero-copy{color:#727880;font-size:13px;line-height:1.6;margin:0 0 16px}.composer{border:1px solid #e0e3e6;border-radius:18px;background:#fbfcfd;overflow:hidden}.composer textarea{display:block;width:100%;min-height:96px;resize:vertical;border:0;outline:0;background:transparent;padding:16px 16px 8px;color:var(--ink);font-size:15px;line-height:1.6}.composer textarea::placeholder{color:#b5b9bd}.composer-foot{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 10px 13px}.voice-btn{display:flex;align-items:center;gap:6px;border:0;background:transparent;color:#8d9299;font-size:12px;padding:8px 4px}.voice-btn.recording{color:var(--orange-deep);font-weight:700}.send-btn{display:flex;align-items:center;gap:7px;border:0;border-radius:12px;background:var(--orange);color:#fff;padding:10px 14px;font-weight:700;box-shadow:0 5px 12px rgba(223,122,78,.2)}.send-btn:hover{background:var(--orange-deep)}.hint{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.hint button{border:0;border-radius:999px;background:#f3f4f5;color:#777e84;font-size:11px;padding:7px 10px}.section{margin-top:22px}.section-head{display:flex;justify-content:space-between;align-items:end;margin:0 2px 10px}.section-head h3{font-size:16px;letter-spacing:-.04em;margin:0}.section-head p{font-size:11px;color:var(--muted);margin:4px 0 0}.clear-btn{border:0;background:transparent;color:#9b6a55;font-size:11px}.feed{display:grid;gap:12px}.notice{display:flex;align-items:flex-start;gap:10px;padding:0 2px;color:#6f757c;font-size:13px;line-height:1.55}.notice-bar{width:4px;min-height:34px;border-radius:99px;background:var(--orange);flex:0 0 auto}.message{display:flex;justify-content:flex-end}.message.user p{background:#fff;border:1px solid var(--line)}.message p{max-width:88%;margin:0;padding:12px 15px;border-radius:18px;font-size:14px;line-height:1.55;box-shadow:0 3px 10px rgba(52,59,69,.03)}.result-card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--orange);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.result-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 17px 10px}.result-title{font-size:18px;font-weight:800;letter-spacing:-.04em}.result-state{font-size:11px;color:var(--green);white-space:nowrap}.result-meta{display:flex;gap:10px;flex-wrap:wrap;padding:0 17px 13px;color:#70777e;font-size:12px}.category{border-radius:7px;padding:5px 8px;font-size:11px;font-weight:700}.category.运动{background:var(--green-soft);color:#4d896d}.category.工作{background:var(--blue-soft);color:#557aa8}.category.学习{background:var(--purple-soft);color:#786298}.category.生活{background:var(--yellow-soft);color:#9d8141}.category.其他{background:#f0f1f2;color:#747a81}.result-actions{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #f0f1f2;padding:10px 14px}.result-actions button{border:0;border-radius:10px;padding:9px 12px;font-size:12px}.edit-btn{background:#f3f4f5;color:#676e75}.write-btn{background:var(--orange-soft);color:#b9623e;font-weight:700}.result-card.written{border-top-color:var(--green)}.result-card.written .write-btn{background:var(--green-soft);color:#4d896d}.empty{padding:26px 16px;text-align:center;color:#a0a5aa;background:#fff;border:1px dashed #dfe2e5;border-radius:16px;font-size:12px}.bottom-nav{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(calc(100% - 30px),520px);display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border:1px solid #e3e5e7;border-radius:18px;box-shadow:0 12px 30px rgba(52,59,69,.13);z-index:5}.nav{border:0;background:transparent;border-radius:13px;padding:8px 5px;color:#9a9fa5;font-size:11px}.nav span{display:block;font-size:16px;margin-bottom:2px}.nav.active{background:#f1f2f3;color:var(--ink);font-weight:700}.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(35,39,44,.25);z-index:10;place-items:center;padding:18px}.modal-backdrop.open{display:grid}.modal{width:min(100%,480px);max-height:88vh;overflow:auto;background:#fff;border-radius:22px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal h3{margin:0 0 15px;font-size:20px}.form{display:grid;gap:11px}.form label{font-size:11px;color:#7d8389}.form input,.form select,.form textarea{display:block;width:100%;margin-top:5px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafbfc;outline:0;color:var(--ink)}.form textarea{min-height:65px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.modal-actions button{border:0;border-radius:10px;padding:10px 14px}.cancel{background:#f0f1f2;color:#666}.save{background:var(--orange);color:#fff;font-weight:700}@media(max-width:520px){.app{padding:15px 13px 100px}.topbar{align-items:flex-start}.calendar-pill{font-size:11px;padding:8px 10px}.hero{padding:18px 16px 15px;border-radius:20px}.hero h2{font-size:22px}.message p{max-width:94%}.result-top{padding:14px 14px 8px}.result-meta{padding:0 14px 11px}.result-actions{padding:9px 11px}.bottom-nav{bottom:11px}}
</style>
<style>
/* 用户偏好：沿用之前的绿色视觉，不使用橙色强调。 */
:root{--orange:#b8cf8e;--orange-deep:#7e9f58;--orange-soft:#edf5df}
.logo{background:linear-gradient(135deg,#cfe3a5,#8fb36b);box-shadow:0 5px 12px rgba(126,159,88,.22)}
.send-btn{box-shadow:0 5px 12px rgba(126,159,88,.22)}
.clear-btn{color:#6d8d4d}
.notice-bar{background:var(--orange)}
.result-card{border-top-color:var(--orange)}
.write-btn{color:#668844}
.save{background:var(--orange)}
</style>
</head>
<body>
<main class="app">
  <header class="topbar"><div class="brand"><div class="logo">◔</div><div><h1>念成事</h1><p>把一句话变成安排</p></div></div><button class="calendar-pill" id="calendarBtn"><span class="dot"></span><span id="calendarText">已连接 Calendar</span></button></header>
  <section class="hero"><div class="hero-kicker"><span>今天 · <span id="todayLabel"></span></span><span>执行前会请求确认</span></div><h2>说出你的安排</h2><p class="hero-copy">一句话，或一次输入多项。系统会识别时间、时长和类别，写入前由你确认。</p><div class="composer"><textarea id="planInput" placeholder="例如：明天晚上 8-9 点洗衣服；周六上午去跑步 1 小时"></textarea><div class="composer-foot"><button class="voice-btn" id="voiceBtn">◉ <span>语音输入</span></button><button class="send-btn" id="analyzeBtn">解析安排 <span>➜</span></button></div></div><div class="hint"><button data-example="明天晚上 8-9 点洗衣服">明天晚上 8-9 点洗衣服</button><button data-example="周六上午 9 点吃早餐；下午 2-5 点看展">一次添加多项</button><button data-example="下周一 10 点开项目复盘会，持续 30 分钟">工作安排</button></div></section>
  <section class="section"><div class="section-head"><div><h3>解析记录</h3><p>先预览，再写入 iPhone Calendar</p></div><button class="clear-btn" id="clearBtn">清空记录</button></div><div class="feed" id="feed"></div></section>
</main>
<nav class="bottom-nav"><button class="nav active"><span>✦</span>输入安排</button><button class="nav" id="todayNav"><span>▣</span>今日计划</button><button class="nav" id="settingsNav"><span>⚙</span>设置</button></nav>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><h3>编辑安排</h3><div class="form"><label>事项<input id="editTitle"></label><label>日期<input id="editDate" type="date"></label><label>开始时间<input id="editTime" type="time"></label><label>时长（分钟）<input id="editDuration" type="number" min="5" step="5"></label><label>类别<select id="editCategory"><option>运动</option><option>工作</option><option>学习</option><option>生活</option><option>其他</option></select></label><label>备注<textarea id="editNote" placeholder="可选"></textarea></label></div><div class="modal-actions"><button class="cancel" id="cancelEdit">取消</button><button class="save" id="saveEdit">保存修改</button></div></div></div>
<script>
const $=s=>document.querySelector(s), STORAGE='xiaojuli-v1', historyKey='xiaojuli-history-v1'; const pad=n=>String(n).padStart(2,'0'); const dateKey=d=>{const x=new Date(d);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`}; const today=new Date(),todayKey=dateKey(today); $('#todayLabel').textContent=`${today.getMonth()+1}月${today.getDate()}日`;
let records=JSON.parse(localStorage.getItem(STORAGE)||'[]'),history=JSON.parse(localStorage.getItem(historyKey)||'[]'),editingId=null,recording=false,recognition=null; const save=()=>localStorage.setItem(STORAGE,JSON.stringify(records)),saveHistory=()=>localStorage.setItem(historyKey,JSON.stringify(history)); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function categoryOf(title){if(/跑|健身|瑜伽|游泳|运动|散步/.test(title))return'运动';if(/会|项目|客户|工作|汇报|复盘|邮件/.test(title))return'工作';if(/学|课|读|看书|考试|练习/.test(title))return'学习';if(/洗|吃|买|打扫|做饭|早餐|晚餐|看展/.test(title))return'生活';return'其他'}
function nextDate(keyword){const d=new Date(today);if(!keyword||keyword==='今天')return d;if(keyword==='明天'){d.setDate(d.getDate()+1);return d}if(keyword==='后天'){d.setDate(d.getDate()+2);return d}const days={日:0,一:1,二:2,三:3,四:4,五:5,六:6};if(keyword.includes('周')){const target=days[keyword.slice(-1)],delta=(target-d.getDay()+7)%7;d.setDate(d.getDate()+(delta||7))}return d}
function parseOne(raw){let text=raw.trim(),date=today,time='09:00',duration=60;const dateMatch=text.match(/(今天|明天|后天|下周[一二三四五六日]|周[一二三四五六日])/);if(dateMatch){date=nextDate(dateMatch[1]);text=text.replace(dateMatch[0],'')}const range=text.match(/(上午|下午|晚上|早上)?\s*(\d{1,2})(?::|点)?(\d{0,2})?\s*[-至到]\s*(\d{1,2})(?::|点)?(\d{0,2})?/);const single=text.match(/(上午|下午|晚上|早上)?\s*(\d{1,2})(?:点|:)(\d{0,2})?/);if(range){let h=+range[2],m=+(range[3]||0);if(/下午|晚上/.test(range[1]||'')&&h<12)h+=12;time=`${pad(h)}:${pad(m)}`;duration=(+range[5]*60+ +(range[6]||0))-(h*60+m);if(duration<=0)duration=60;text=text.replace(range[0],'')}else if(single){let h=+single[2],m=+(single[3]||0);if(/下午|晚上/.test(single[1]||'')&&h<12)h+=12;time=`${pad(h)}:${pad(m)}`;text=text.replace(single[0],'')}const dur=text.match(/(?:持续|时长|约)\s*(\d+)\s*(分钟|分|小时)?/);if(dur){duration=+dur[1]*(dur[2]==='小时'?60:1);text=text.replace(dur[0],'')}text=text.replace(/^(上午|下午|晚上|早上)\s*/,'').replace(/点(?=洗|吃|去|看|开|做|跑|学)/g,' ').replace(/[，。,.；;！!]+/g,' ').replace(/\s+/g,' ').trim()||'未命名安排';return{id:crypto.randomUUID(),raw,title:text,date:dateKey(date),startTime:time,duration:Math.max(5,duration),category:categoryOf(text),note:'智能识别 · 待确认',status:'待写入',written:false,createdAt:Date.now()}}
function parseInput(value){return value.split(/[；;\n]+/).map(parseOne).filter(x=>x.title)} function endTime(item){const[h,m]=item.startTime.split(':').map(Number),t=h*60+m+Number(item.duration);return `${pad(Math.floor(t/60)%24)}:${pad(t%60)}`} function findItem(id){for(const b of history)if(b.items){const item=b.items.find(x=>x.id===id);if(item)return item}}
function card(item){return `<article class="result-card ${item.written?'written':''}" data-id="${item.id}"><div class="result-top"><div class="result-title">${esc(item.title)}</div><div class="result-state">${item.written?'已写入':'待确认'}</div></div><div class="result-meta"><span>${esc(item.date.slice(5).replace('-','月')+'日')}</span><span>${esc(item.startTime)} – ${esc(endTime(item))}</span><span>${item.duration} 分钟</span><span class="category ${esc(item.category)}">● ${esc(item.category)}</span></div><div class="result-actions"><button class="edit-btn" data-edit="${item.id}">编辑</button>${item.written?'<button class="write-btn" data-unwrite="'+item.id+'">已写入</button>':'<button class="write-btn" data-write="'+item.id+'">写入 Calendar</button>'}</div></article>`}
function render(){const feed=$('#feed');if(!history.length){feed.innerHTML='<div class="empty">还没有解析记录。输入一句安排，结果会出现在这里。</div>';return}feed.innerHTML=history.slice().reverse().map(r=>r.type==='notice'?`<div class="notice"><span class="notice-bar"></span><div>${esc(r.text)}<div style="font-size:11px;color:#a0a5aa;margin-top:3px">${esc(r.time)}</div></div></div>`:`<div class="message user"><p>${esc(r.raw)}</p></div>${r.items.map(card).join('')}`).join('')}
function notice(text){history.push({type:'notice',text,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});saveHistory();render()} function addBatch(raw){const items=parseInput(raw);if(!items.length)return;history.push({type:'batch',raw,items});saveHistory();render();$('#planInput').value='';setTimeout(()=>document.querySelector('.result-card')?.scrollIntoView({behavior:'smooth',block:'center'}),50)} function writeItem(item){item.written=!item.written;item.status=item.written?'已写入':'待写入';if(item.written){records.push({...item});records=records.filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i);save();notice(`已写入 Apple Calendar · ${item.category}`)}else{records=records.filter(x=>x.id!==item.id);save();notice('已撤销写入，未删除解析记录')}saveHistory();render()}
function openEdit(item){editingId=item.id;$('#editTitle').value=item.title;$('#editDate').value=item.date;$('#editTime').value=item.startTime;$('#editDuration').value=item.duration;$('#editCategory').value=item.category;$('#editNote').value=item.note||'';$('#modalBackdrop').classList.add('open')}
$('#analyzeBtn').onclick=()=>{const v=$('#planInput').value.trim();if(v)addBatch(v)};$('#planInput').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')$('#analyzeBtn').click()});document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{$('#planInput').value=b.dataset.example;$('#planInput').focus()});$('#feed').addEventListener('click',e=>{const w=e.target.closest('[data-write],[data-unwrite]'),ed=e.target.closest('[data-edit]');if(w)writeItem(findItem(w.dataset.write||w.dataset.unwrite));if(ed)openEdit(findItem(ed.dataset.edit))});$('#clearBtn').onclick=()=>{if(confirm('清空所有解析记录？')){history=[];saveHistory();render()}};$('#cancelEdit').onclick=()=>$('#modalBackdrop').classList.remove('open');$('#saveEdit').onclick=()=>{const item=findItem(editingId);if(!item)return;item.title=$('#editTitle').value.trim()||item.title;item.date=$('#editDate').value;item.startTime=$('#editTime').value;item.duration=Number($('#editDuration').value)||60;item.category=$('#editCategory').value;item.note=$('#editNote').value.trim()||'手动编辑';saveHistory();$('#modalBackdrop').classList.remove('open');render();notice('已保存修改，仍未写入 Calendar')};
$('#calendarBtn').onclick=()=>{const t=$('#calendarText');t.textContent=t.textContent.includes('已连接')?'未连接 Calendar':'已连接 Calendar';$('#calendarBtn .dot').style.background=t.textContent.includes('已连接')?'var(--green)':'#c7cbd0';notice(t.textContent)};$('#todayNav').onclick=()=>{const items=records.filter(x=>x.date===todayKey);alert(items.length?`今天已写入 ${items.length} 项：\n${items.map(x=>x.startTime+' '+x.title).join('\n')}`:'今天还没有已写入的安排。')};$('#settingsNav').onclick=()=>alert('当前设置：本地保存 · 中文语音识别 · 写入前确认');
$('#voiceBtn').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('当前浏览器不支持语音识别，请使用文字输入。');return}if(recording){recognition?.stop();return}recognition=new SR();recognition.lang='zh-CN';recognition.interimResults=false;recognition.onstart=()=>{recording=true;$('#voiceBtn').classList.add('recording');$('#voiceBtn').innerHTML='● <span>正在听…点击结束</span>'};recognition.onresult=e=>{$('#planInput').value+=($('#planInput').value?'；':'')+e.results[0][0].transcript};recognition.onend=()=>{recording=false;$('#voiceBtn').classList.remove('recording');$('#voiceBtn').innerHTML='◉ <span>语音输入</span>'};recognition.start()};render();
</script>
</body>
</html>
